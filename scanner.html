<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <meta name="description" content="Сканер QR-кодов с чеков для 1С с расшифровкой">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Сканер чеков ФНС</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container { 
            background: white; 
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { color: #333; text-align: center; margin-bottom: 20px; font-size: 24px; }
        .video-container {
            position: relative; width: 100%; border-radius: 12px; overflow: hidden;
            background: #000; margin-bottom: 15px;
        }
        #video { width: 100%; display: block; }
        .scan-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px; border: 3px solid #4CAF50; border-radius: 12px;
            pointer-events: none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }
        .scan-line {
            position: absolute; width: 100%; height: 3px; background: #4CAF50;
            animation: scan 2s linear infinite; box-shadow: 0 0 10px #4CAF50;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .button { 
            display: block; width: 100%; padding: 16px; margin: 8px 0; font-size: 16px; 
            font-weight: bold; border: none; border-radius: 12px; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .button:active { transform: scale(0.98); }
        .btn-scan { background: #4CAF50; color: white; }
        .btn-scan.scanning { background: #ff9800; }
        .btn-export { background: #2196F3; color: white; }
        .btn-clear { background: #f44336; color: white; }
        #status { 
            padding: 14px; margin: 15px 0; border-radius: 10px; display: none; 
            text-align: center; font-weight: bold; animation: slideIn 0.3s;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .error { background: #fff3cd; color: #856404; border: 2px solid #ffeaa7; }
        .info { background: #d1ecf1; color: #0c5460; border: 2px solid #bee5eb; }
        .stats { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 15px; border-radius: 12px; text-align: center; 
            margin: 15px 0; font-size: 20px; font-weight: bold;
        }
        .codes-container { margin-top: 20px; max-height: 600px; overflow-y: auto; }
        .code-item { 
            padding: 15px; margin: 10px 0; background: #f8f9fa; 
            border-left: 5px solid #4CAF50; border-radius: 8px; 
            transition: all 0.3s;
        }
        .code-item.error-border { border-left-color: #f44336; }
        .code-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; color: #333; }
        .receipt-summary { font-size: 15px; color: #333; margin-bottom: 8px; font-weight: 600; }
        .receipt-items { 
            background: white; padding: 10px; border-radius: 6px; 
            font-size: 13px; color: #333; max-height: 200px; overflow-y: auto;
            margin-top: 8px;
        }
        .item-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
        .item-row:last-child { border-bottom: none; }
        .item-name { flex: 1; }
        .item-qty { color: #666; margin: 0 10px; }
        .item-price { font-weight: 600; color: #4CAF50; }
        .receipt-details { font-size: 12px; color: #666; word-break: break-all; margin-top: 5px; }
        .empty-state { text-align: center; padding: 40px; color: #999; font-style: italic; }
        .footer { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.8); font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Сканер чеков ФНС</h1>
        
        <div class="video-container">
            <video id="video" playsinline></video>
            <div class="scan-overlay"><div class="scan-line"></div></div>
        </div>
        
        <button class="button btn-scan" id="scanBtn" onclick="toggleScan()">📷 Начать сканирование</button>
        <button class="button btn-export" onclick="exportToCSV()">📥 Экспорт в CSV для 1С</button>
        <button class="button btn-clear" onclick="clearCodes()">🗑️ Очистить все</button>
        
        <div id="status"></div>
        
        <div class="stats">📊 Сохранено чеков: <span id="count">0</span></div>
        
        <div class="codes-container" id="codes-list">
            <div class="empty-state">Нет сохраненных чеков<br>Отсканируйте первый чек!</div>
        </div>
    </div>
    
    <div class="footer">v3.0 | proverkacheka.com API | Расшифровка состава чека</div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        let video = document.getElementById('video');
        let canvas = document.createElement('canvas');
        let context = canvas.getContext('2d');
        let scanning = false;
        let scanTimeout = null;
        let stream = null;

        // API proverkacheka.com
        const CHECK_API_URL = 'https://api.proverkacheka.com/api/v1/check/';

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }

        window.onload = function() { 
            loadSavedCodes();
            checkCameraPermission();
        };

        function checkCameraPermission() {
            navigator.permissions.query({ name: 'camera' }).then(result => {
                if (result.state === 'denied') showStatus('️ Доступ к камере запрещен в настройках браузера.', 'error');
            });
        }

        function toggleScan() {
            scanning ? stopScan() : startScan();
        }

        function startScan() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } })
            .then(function(mediaStream) {
                stream = mediaStream;
                video.srcObject = stream;
                video.play();
                scanning = true;
                const btn = document.getElementById('scanBtn');
                btn.textContent = '⏹️ Остановить камеру';
                btn.classList.add('scanning');
                showStatus('📡 Наведите камеру на QR-код чека', 'info');
                requestAnimationFrame(tick);
            })
            .catch(function(err) {
                showStatus('❌ Ошибка камеры: ' + err.message, 'error');
            });
        }

        function stopScan() {
            scanning = false;
            if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
            if (scanTimeout) { clearTimeout(scanTimeout); scanTimeout = null; }
            const btn = document.getElementById('scanBtn');
            btn.textContent = '📷 Начать сканирование';
            btn.classList.remove('scanning');
        }

        function tick() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                let imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                let code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    handleScan(code.data);
                    return;
                }
            }
            requestAnimationFrame(tick);
        }

        async function handleScan(qrData) {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            
            if (receipts.some(r => r.qr === qrData)) {
                showStatus('⚠️ Этот чек уже сохранен!', 'error');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                return;
            }

            showStatus('⏳ Расшифровка через proverkacheka.com...', 'info');
            
            try {
                // Используем API proverkacheka.com
                const response = await fetch(CHECK_API_URL + 'sync', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        qr: qrData,
                        format: 'json'
                    })
                });
                
                if (!response.ok) {
                    throw new Error('API вернул ошибку: ' + response.status);
                }
                
                const data = await response.json();
                
                // Проверяем успешность расшифровки
                if (data.status !== 'ok' || !data.data || !data.data.receipt) {
                    throw new Error('Не удалось расшифровать чек');
                }
                
                const receipt = data.data.receipt;
                
                // Сохраняем расшифрованные данные
                const receiptObj = {
                    qr: qrData,
                    date: receipt.dateTime || parseQRDate(qrData),
                    total: receipt.totalSum ? (receipt.totalSum / 100).toFixed(2) : parseQRSum(qrData),
                    shop: receipt.user || '',
                    items: receipt.items || [],
                    timestamp: Date.now(),
                    status: 'ok'
                };
                
                receipts.push(receiptObj);
                localStorage.setItem('receipts', JSON.stringify(receipts));
                
                if (navigator.vibrate) navigator.vibrate(200);
                showStatus('✅ Чек расшифрован и сохранен!', 'success');
                loadSavedCodes();
                
            } catch (error) {
                console.error('API Error:', error);
                showStatus('❌ Ошибка расшифровки: ' + error.message, 'error');
                
                // Если API не сработал, сохраняем хотя бы базовые данные из QR
                const basicInfo = parseQRCode(qrData);
                receipts.push({
                    qr: qrData,
                    date: basicInfo.date,
                    total: basicInfo.sum,
                    items: [],
                    timestamp: Date.now(),
                    status: 'partial'
                });
                localStorage.setItem('receipts', JSON.stringify(receipts));
                showStatus('⚠️ Сохранен без расшифровки', 'error');
                loadSavedCodes();
            }
            
            // Авто-перезапуск камеры
            scanning = false;
            scanTimeout = setTimeout(() => {
                if (document.getElementById('scanBtn').classList.contains('scanning')) {
                    scanning = true;
                    requestAnimationFrame(tick);
                }
            }, 1500);
        }

        function parseQRCode(qrData) {
            let result = { date: 'Не определена', sum: '0.00' };
            
            const t = extractQRParam(qrData, 't');
            if (t && t.length >= 8) {
                const year = t.substr(0, 4);
                const month = t.substr(4, 2);
                const day = t.substr(6, 2);
                result.date = `${day}.${month}.${year}`;
            }
            
            const s = extractQRParam(qrData, 's');
            if (s) {
                result.sum = (parseFloat(s) / 100).toFixed(2);
            }
            
            return result;
        }

        function parseQRDate(qrData) {
            const t = extractQRParam(qrData, 't');
            if (t && t.length >= 8) {
                const year = t.substr(0, 4);
                const month = t.substr(4, 2);
                const day = t.substr(6, 2);
                return `${day}.${month}.${year}`;
            }
            return 'Не определена';
        }

        function parseQRSum(qrData) {
            const s = extractQRParam(qrData, 's');
            if (s) {
                return (parseFloat(s) / 100).toFixed(2);
            }
            return '0.00';
        }

        function extractQRParam(qrData, paramName) {
            const params = new URLSearchParams(qrData);
            return params.get(paramName);
        }

        function loadSavedCodes() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            document.getElementById('count').textContent = receipts.length;
            
            const list = document.getElementById('codes-list');
            
            if (receipts.length === 0) {
                list.innerHTML = '<div class="empty-state">Нет сохраненных чеков<br>Отсканируйте первый чек!</div>';
                return;
            }
            
            list.innerHTML = '';
            const displayCodes = receipts.slice(-10).reverse();
            
            displayCodes.forEach((receipt, index) => {
                const realIndex = receipts.length - index;
                
                const div = document.createElement('div');
                div.className = 'code-item';
                if (receipt.status === 'partial') {
                    div.classList.add('error-border');
                }
                
                let html = `
                    <div class="code-header">
                        <span>Чек #${realIndex}</span>
                        <span>${receipt.date || 'Дата не определена'}</span>
                    </div>
                    <div class="receipt-summary">💰 ${receipt.total} ₽</div>
                `;
                
                if (receipt.shop) {
                    html += `<div style="font-size:12px;color:#666;margin-bottom:5px">🏪 ${receipt.shop}</div>`;
                }
                
                // Показываем товары, если есть
                if (receipt.items && receipt.items.length > 0) {
                    html += '<div class="receipt-items">';
                    receipt.items.forEach(item => {
                        const name = item.name || 'Товар';
                        const qty = item.quantity || 1;
                        const price = (item.price || 0) / 100;
                        const sum = (item.sum || 0) / 100;
                        
                        html += `
                            <div class="item-row">
                                <span class="item-name">${name}</span>
                                <span class="item-qty">${qty} шт.</span>
                                <span class="item-price">${sum.toFixed(2)} ₽</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                } else if (receipt.status === 'partial') {
                    html += '<div style="font-size:12px;color:#f44336;margin-top:5px">⚠️ Без расшифровки состава</div>';
                }
                
                html += `<div class="receipt-details">QR: ${receipt.qr.substring(0, 50)}...</div>`;
                div.innerHTML = html;
                list.appendChild(div);
            });
            
            if (receipts.length > 10) {
                const more = document.createElement('div');
                more.className = 'code-item';
                more.style.textAlign = 'center';
                more.style.color = '#666';
                more.style.fontStyle = 'italic';
                more.textContent = `... и еще ${receipts.length - 10} чеков`;
                list.appendChild(more);
            }
        }

        function exportToCSV() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            
            if (receipts.length === 0) {
                showStatus('❌ Нет чеков для экспорта', 'error');
                return;
            }
            
            // Создаем CSV с BOM для корректного отображения кириллицы
            let csvContent = "\uFEFFДата;Сумма;Магазин;Товары;Количество;Цена;QR-код\n";
            
            receipts.forEach(receipt => {
                const date = receipt.date || '';
                const total = receipt.total || '0.00';
                const shop = (receipt.shop || '').replace(/;/g, ',');
                const qr = receipt.qr.replace(/"/g, '""');
                
                if (receipt.items && receipt.items.length > 0) {
                    // Если есть товары, создаем строку для каждого
                    receipt.items.forEach((item, idx) => {
                        const name = (item.name || 'Товар').replace(/;/g, ',').replace(/"/g, '""');
                        const qty = item.quantity || 1;
                        const price = ((item.price || 0) / 100).toFixed(2);
                        
                        // Для первой строки пишем дату и общую сумму, для остальных оставляем пустым
                        const csvDate = idx === 0 ? date : '';
                        const csvTotal = idx === 0 ? total : '';
                        const csvShop = idx === 0 ? shop : '';
                        const csvQR = idx === 0 ? qr : '';
                        
                        csvContent += `${csvDate};${csvTotal};${csvShop};"${name}";${qty};${price};${csvQR}\n`;
                    });
                } else {
                    // Если товаров нет, пишем одной строкой
                    csvContent += `${date};${total};${shop};"Без детализации";1;${total};${qr}\n`;
                }
            });
            
            const dateStr = new Date().toISOString().slice(0,10);
            const filename = `Чеки_ФНС_${dateStr}.csv`;
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus(`📥 Файл ${filename} скачан!`, 'success');
        }

        function clearCodes() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            if (receipts.length === 0) {
                showStatus('Нет чеков для удаления', 'error');
                return;
            }
            
            if (confirm(`⚠️ Удалить ВСЕ ${receipts.length} чеков?\n\nЭто действие нельзя отменить!`)) {
                localStorage.removeItem('receipts');
                loadSavedCodes();
                showStatus('️ Все чеки удалены', 'success');
                if (navigator.vibrate) navigator.vibrate(100);
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
            status.style.display = 'block';
            setTimeout(() => { status.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
