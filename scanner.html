<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <meta name="description" content="Сканер QR-кодов с чеков для 1С с расшифровкой API">
    <title>Сканер чеков ФНС</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container { 
            background: white; border-radius: 20px; padding: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-width: 600px; margin: 0 auto;
        }
        h1 { color: #333; text-align: center; margin-bottom: 15px; font-size: 24px; }
        .api-section {
            background: #f0f0f0; padding: 15px; border-radius: 12px; margin-bottom: 15px;
        }
        .api-section label {
            display: block; font-weight: bold; margin-bottom: 8px; color: #333;
        }
        .api-input {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px;
            font-size: 14px; font-family: monospace;
        }
        .api-input:focus { outline: none; border-color: #4CAF50; }
        .api-status {
            font-size: 12px; margin-top: 8px; padding: 8px; border-radius: 6px;
        }
        .api-status.ok { background: #d4edda; color: #155724; }
        .api-status.error { background: #f8d7da; color: #721c24; }
        .video-container {
            position: relative; width: 100%; border-radius: 12px; overflow: hidden;
            background: #000; margin-bottom: 15px;
        }
        #video { width: 100%; display: block; }
        .scan-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px; border: 3px solid #4CAF50; border-radius: 12px;
            pointer-events: none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }
        .scan-line {
            position: absolute; width: 100%; height: 3px; background: #4CAF50;
            animation: scan 2s linear infinite; box-shadow: 0 0 10px #4CAF50;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .button { 
            display: block; width: 100%; padding: 16px; margin: 8px 0; font-size: 16px; 
            font-weight: bold; border: none; border-radius: 12px; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .button:active { transform: scale(0.98); }
        .btn-scan { background: #4CAF50; color: white; }
        .btn-scan.scanning { background: #ff9800; }
        .btn-excel { background: #217346; color: white; }
        .btn-1c { background: #FF7F3F; color: white; }
        .btn-clear { background: #f44336; color: white; }
        #status { 
            padding: 14px; margin: 15px 0; border-radius: 10px; display: none; 
            text-align: center; font-weight: bold; animation: slideIn 0.3s; font-size: 14px;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .error { background: #fff3cd; color: #856404; border: 2px solid #ffeaa7; }
        .info { background: #d1ecf1; color: #0c5460; border: 2px solid #bee5eb; }
        .stats { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 15px; border-radius: 12px; text-align: center; 
            margin: 15px 0; font-size: 20px; font-weight: bold;
        }
        .codes-container { margin-top: 20px; max-height: 600px; overflow-y: auto; }
        .code-item { 
            padding: 15px; margin: 10px 0; background: #f8f9fa; 
            border-left: 5px solid #4CAF50; border-radius: 8px; transition: all 0.3s;
        }
        .code-item.error-border { border-left-color: #f44336; }
        .code-item.partial-border { border-left-color: #ff9800; }
        .code-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; color: #333; }
        .receipt-summary { font-size: 16px; color: #333; margin-bottom: 8px; font-weight: 700; }
        .receipt-items { 
            background: white; padding: 10px; border-radius: 6px; 
            font-size: 13px; color: #333; max-height: 200px; overflow-y: auto; margin-top: 8px;
        }
        .item-row { 
            display: flex; justify-content: space-between; padding: 5px 0; 
            border-bottom: 1px solid #eee; align-items: center;
        }
        .item-row:last-child { border-bottom: none; }
        .item-name { flex: 1; font-size: 12px; }
        .item-qty { color: #666; margin: 0 8px; white-space: nowrap; font-size: 12px; }
        .item-price { font-weight: 600; color: #4CAF50; white-space: nowrap; font-size: 12px; }
        .receipt-details { font-size: 11px; color: #999; word-break: break-all; margin-top: 8px; }
        .empty-state { text-align: center; padding: 40px; color: #999; font-style: italic; }
        .footer { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.8); font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1> Сканер чеков ФНС</h1>
        
        <!-- Секция API ключа -->
        <div class="api-section">
            <label for="apiToken">🔑 Токен API proverkacheka.com:</label>
            <input type="text" id="apiToken" class="api-input" placeholder="53441.PmJ2NluFAgH99EwRY">
            <div id="apiStatus" class="api-status" style="display: none;"></div>
        </div>
        
        <div class="video-container">
            <video id="video" playsinline></video>
            <div class="scan-overlay"><div class="scan-line"></div></div>
        </div>
        
        <button class="button btn-scan" id="scanBtn" onclick="toggleScan()">📷 Начать сканирование</button>
        <button class="button btn-excel" onclick="exportToExcel()"> Экспорт в Excel (CSV)</button>
        <button class="button btn-1c" onclick="exportTo1C()">💼 Экспорт для 1С (TXT)</button>
        <button class="button btn-clear" onclick="clearCodes()">️ Очистить все</button>
        
        <div id="status"></div>
        <div class="stats">📊 Сохранено чеков: <span id="count">0</span></div>
        
        <div class="codes-container" id="codes-list">
            <div class="empty-state">Нет сохраненных чеков<br>Отсканируйте первый чек!</div>
        </div>
    </div>
    
    <div class="footer">v5.0 | API proverkacheka.com | Расшифровка состава чека</div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        let video = document.getElementById('video');
        let canvas = document.createElement('canvas');
        let context = canvas.getContext('2d');
        let scanning = false;
        let scanTimeout = null;
        let stream = null;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }

        window.onload = function() { 
            loadSavedCodes(); 
            checkCameraPermission();
            loadApiToken();
        };

        function loadApiToken() {
            const savedToken = localStorage.getItem('proverka_api_token');
            if (savedToken) {
                document.getElementById('apiToken').value = savedToken;
                showApiStatus('✅ Токен загружен из памяти', 'ok');
            }
        }

        function saveApiToken() {
            const token = document.getElementById('apiToken').value.trim();
            localStorage.setItem('proverka_api_token', token);
            if (token) {
                showApiStatus('✅ Токен сохранен', 'ok');
            } else {
                showApiStatus('⚠️ Токен не указан', 'error');
            }
        }

        function showApiStatus(message, type) {
            const status = document.getElementById('apiStatus');
            status.textContent = message;
            status.className = 'api-status ' + type;
            status.style.display = 'block';
        }

        // Сохраняем токен при изменении
        document.getElementById('apiToken').addEventListener('change', saveApiToken);

        function checkCameraPermission() {
            navigator.permissions.query({ name: 'camera' }).then(result => {
                if (result.state === 'denied') showStatus('⚠️ Доступ к камере запрещен.', 'error');
            });
        }

        function toggleScan() { scanning ? stopScan() : startScan(); }

        function startScan() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } })
            .then(function(mediaStream) {
                stream = mediaStream;
                video.srcObject = stream;
                video.play();
                scanning = true;
                const btn = document.getElementById('scanBtn');
                btn.textContent = '⏹️ Остановить камеру';
                btn.classList.add('scanning');
                showStatus('📡 Наведите камеру на QR-код чека', 'info');
                requestAnimationFrame(tick);
            })
            .catch(function(err) { showStatus('❌ Ошибка камеры: ' + err.message, 'error'); });
        }

        function stopScan() {
            scanning = false;
            if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
            if (scanTimeout) { clearTimeout(scanTimeout); scanTimeout = null; }
            const btn = document.getElementById('scanBtn');
            btn.textContent = '📷 Начать сканирование';
            btn.classList.remove('scanning');
        }

        function tick() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                let imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                let code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    handleScan(code.data);
                    return;
                }
            }
            requestAnimationFrame(tick);
        }

        async function handleScan(qrData) {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            
            if (receipts.some(r => r.qr === qrData)) {
                showStatus('⚠️ Этот чек уже сохранен!', 'error');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                return;
            }

            const apiToken = document.getElementById('apiToken').value.trim();
            
            if (!apiToken) {
                showStatus('️ Введите API токен!', 'error');
                return;
            }

            showStatus(' Расшифровка через API...', 'info');
            
            let receiptObj = {
                qr: qrData,
                date: parseQRDate(qrData),
                total: parseQRSum(qrData),
                items: [],
                timestamp: Date.now(),
                status: 'partial'
            };

            try {
                // Запрос к API proverkacheka.com
                const response = await fetch('https://api.proverkacheka.com/api/v1/check/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        token: apiToken,
                        qr: qrData
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Проверяем успешность
                if (data.success || data.status === 'ok') {
                    const receiptData = data.data || data;
                    
                    receiptObj = {
                        qr: qrData,
                        date: receiptData.date || parseQRDate(qrData),
                        total: receiptData.total || parseQRSum(qrData),
                        shop: receiptData.shop || receiptData.retailPlace || '',
                        items: receiptData.items || [],
                        timestamp: Date.now(),
                        status: 'ok'
                    };
                    
                    if (navigator.vibrate) navigator.vibrate(200);
                    showStatus('✅ Чек расшифрован с составом!', 'success');
                } else {
                    throw new Error(data.message || 'API вернул ошибку');
                }
                
            } catch (error) {
                console.error('API Error:', error);
                showStatus('️ API ошибка: ' + error.message + '. Сохраняю базовые данные.', 'error');
                receiptObj.apiError = error.message;
            }
            
            receipts.push(receiptObj);
            localStorage.setItem('receipts', JSON.stringify(receipts));
            loadSavedCodes();
            
            scanning = false;
            scanTimeout = setTimeout(() => {
                if (document.getElementById('scanBtn').classList.contains('scanning')) {
                    scanning = true;
                    requestAnimationFrame(tick);
                }
            }, 1500);
        }

        function parseQRDate(qrData) {
            const t = extractQRParam(qrData, 't');
            if (t && t.length >= 8) {
                return `${t.substr(6, 2)}.${t.substr(4, 2)}.${t.substr(0, 4)}`;
            }
            return new Date().toLocaleDateString('ru-RU');
        }

        function parseQRSum(qrData) {
            const s = extractQRParam(qrData, 's');
            if (s) {
                return parseFloat(s).toFixed(2);
            }
            return '0.00';
        }

        function extractQRParam(qrData, paramName) {
            const params = new URLSearchParams(qrData);
            return params.get(paramName);
        }

        function loadSavedCodes() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            document.getElementById('count').textContent = receipts.length;
            const list = document.getElementById('codes-list');
            
            if (receipts.length === 0) {
                list.innerHTML = '<div class="empty-state">Нет сохраненных чеков<br>Отсканируйте первый чек!</div>';
                return;
            }
            
            list.innerHTML = '';
            const displayCodes = receipts.slice(-10).reverse();
            
            displayCodes.forEach((receipt, index) => {
                const realIndex = receipts.length - index;
                const div = document.createElement('div');
                div.className = 'code-item';
                if (receipt.status === 'partial') div.classList.add('partial-border');
                if (receipt.status === 'error') div.classList.add('error-border');
                
                let html = `
                    <div class="code-header">
                        <span>Чек #${realIndex}</span>
                        <span>${receipt.date}</span>
                    </div>
                    <div class="receipt-summary">💰 ${receipt.total} ₽</div>
                `;
                
                if (receipt.shop) {
                    html += `<div style="font-size:12px;color:#666;margin-bottom:5px">🏪 ${receipt.shop}</div>`;
                }
                
                if (receipt.items && receipt.items.length > 0) {
                    html += '<div class="receipt-items">';
                    receipt.items.forEach(item => {
                        const name = item.name || item.text || 'Товар';
                        const qty = item.quantity || 1;
                        const price = item.price || 0;
                        const sum = item.sum || (price * qty);
                        
                        html += `
                            <div class="item-row">
                                <span class="item-name">${name}</span>
                                <span class="item-qty">${qty} шт.</span>
                                <span class="item-price">${sum.toFixed(2)} ₽</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                } else if (receipt.status === 'partial') {
                    html += `<div style="font-size:12px;color:#ff9800;margin-top:5px">⚠️ Без состава (API: ${receipt.apiError || 'ошибка'})</div>`;
                }
                
                html += `<div class="receipt-details">QR: ${receipt.qr.substring(0, 50)}...</div>`;
                div.innerHTML = html;
                list.appendChild(div);
            });
            
            if (receipts.length > 10) {
                const more = document.createElement('div');
                more.className = 'code-item';
                more.style.textAlign = 'center'; more.style.color = '#666'; more.style.fontStyle = 'italic';
                more.textContent = `... и еще ${receipts.length - 10} чеков`;
                list.appendChild(more);
            }
        }

        function exportToExcel() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            if (receipts.length === 0) { showStatus('❌ Нет чеков для экспорта', 'error'); return; }
            
            let csvContent = "\uFEFFДата;Сумма;Магазин;Товар;Количество;Цена;QR-код\n";
            
            receipts.forEach(receipt => {
                const date = receipt.date || '';
                const total = receipt.total || '0.00';
                const shop = (receipt.shop || '').replace(/;/g, ',');
                const qr = receipt.qr.replace(/"/g, '""');
                
                if (receipt.items && receipt.items.length > 0) {
                    receipt.items.forEach((item, idx) => {
                        const name = (item.name || item.text || 'Товар').replace(/;/g, ',').replace(/"/g, '""');
                        const qty = item.quantity || 1;
                        const price = (item.price || 0).toFixed(2);
                        const sum = (item.sum || (item.price * item.quantity) || 0).toFixed(2);
                        
                        const csvDate = idx === 0 ? date : '';
                        const csvTotal = idx === 0 ? total : '';
                        const csvShop = idx === 0 ? shop : '';
                        const csvQR = idx === 0 ? qr : '';
                        
                        csvContent += `${csvDate};${csvTotal};${csvShop};"${name}";${qty};${sum};${csvQR}\n`;
                    });
                } else {
                    csvContent += `${date};${total};${shop};"Без детализации";1;${total};${qr}\n`;
                }
            });
            
            const dateStr = new Date().toISOString().slice(0,10);
            const filename = `Чеки_ФНС_${dateStr}.csv`;
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus(` Файл ${filename} скачан!`, 'success');
        }

        function exportTo1C() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            if (receipts.length === 0) { showStatus(' Нет чеков для экспорта', 'error'); return; }
            
            let txtContent = "#1C:UNF\n";
            txtContent += "#Version:1.0\n";
            txtContent += "#Encoding:UTF-8\n";
            txtContent += "#Separator:;\n";
            txtContent += "#Fields:Date,Amount,Shop,Item,Quantity,Price,QRCode\n";
            txtContent += "\n";
            
            receipts.forEach(receipt => {
                const date = receipt.date || '';
                const total = receipt.total || '0.00';
                const shop = (receipt.shop || '').replace(/;/g, ',');
                const qr = receipt.qr.replace(/;/g, ',').replace(/"/g, '""');
                
                if (receipt.items && receipt.items.length > 0) {
                    receipt.items.forEach((item, idx) => {
                        const name = (item.name || item.text || 'Товар').replace(/;/g, ',').replace(/"/g, '""');
                        const qty = item.quantity || 1;
                        const price = (item.price || 0).toFixed(2);
                        
                        const csvDate = idx === 0 ? date : '';
                        const csvTotal = idx === 0 ? total : '';
                        const csvShop = idx === 0 ? shop : '';
                        const csvQR = idx === 0 ? qr : '';
                        
                        txtContent += `${csvDate};${csvTotal};${csvShop};"${name}";${qty};${price};${csvQR}\n`;
                    });
                } else {
                    txtContent += `${date};${total};${shop};"Без детализации";1;${total};${qr}\n`;
                }
            });
            
            const dateStr = new Date().toISOString().slice(0,10);
            const filename = `1C_Чеки_${dateStr}.txt`;
            
            const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus(`💼 Файл ${filename} скачан!`, 'success');
        }

        function clearCodes() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            if (receipts.length === 0) { showStatus('Нет чеков для удаления', 'error'); return; }
            if (confirm(`️ Удалить ВСЕ ${receipts.length} чеков?`)) {
                localStorage.removeItem('receipts');
                loadSavedCodes();
                showStatus('🗑️ Все чеки удалены', 'success');
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
            status.style.display = 'block';
            setTimeout(() => { status.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
