<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <title>Сканер чеков ФНС</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container { 
            background: white; border-radius: 20px; padding: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-width: 600px; margin: 0 auto;
        }
        h1 { color: #333; text-align: center; margin-bottom: 15px; font-size: 24px; }
        .video-container {
            position: relative; width: 100%; border-radius: 12px; overflow: hidden;
            background: #000; margin-bottom: 15px;
        }
        #video { width: 100%; display: block; }
        .scan-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px; border: 3px solid #4CAF50; border-radius: 12px;
            pointer-events: none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }
        .scan-line {
            position: absolute; width: 100%; height: 3px; background: #4CAF50;
            animation: scan 2s linear infinite; box-shadow: 0 0 10px #4CAF50;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .button { 
            display: block; width: 100%; padding: 16px; margin: 8px 0; font-size: 16px; 
            font-weight: bold; border: none; border-radius: 12px; cursor: pointer;
            transition: all 0.3s;
        }
        .button:active { transform: scale(0.98); }
        .btn-scan { background: #4CAF50; color: white; }
        .btn-scan.scanning { background: #ff9800; }
        .btn-excel { background: #217346; color: white; }
        .btn-1c { background: #FF7F3F; color: white; }
        .btn-clear { background: #f44336; color: white; }
        .stats { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 15px; border-radius: 12px; text-align: center; 
            margin: 15px 0; font-size: 20px; font-weight: bold;
        }
        .codes-container { margin-top: 20px; max-height: 600px; overflow-y: auto; }
        .code-item { 
            padding: 15px; margin: 10px 0; background: #f8f9fa; 
            border-left: 5px solid #4CAF50; border-radius: 8px; position: relative;
        }
        .code-item.partial-border { border-left-color: #ff9800; }
        .code-item.no-category { border-left-color: #9e9e9e; }
        .code-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; color: #333; }
        .receipt-summary { font-size: 18px; color: #333; margin-bottom: 8px; font-weight: 700; }
        .receipt-info { font-size: 13px; color: #555; margin-bottom: 4px; word-break: break-word; }
        .receipt-qr-string { 
            font-family: monospace; font-size: 11px; color: #666; 
            background: #f5f5f5; padding: 8px; border-radius: 4px;
            word-break: break-all; margin-top: 8px;
        }
        .receipt-items { 
            background: white; padding: 10px; border-radius: 6px; 
            font-size: 13px; color: #333; margin-top: 8px;
        }
        .item-row { 
            display: flex; justify-content: space-between; padding: 6px 0; 
            border-bottom: 1px solid #eee;
        }
        .item-name { flex: 1; font-size: 12px; }
        .item-qty { color: #666; margin: 0 8px; font-size: 12px; }
        .item-price { font-weight: 600; color: #4CAF50; font-size: 12px; }
        .empty-state { text-align: center; padding: 40px; color: #999; font-style: italic; }
        .log-container {
            margin-top: 20px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        .log-entry {
            padding: 8px;
            margin: 5px 0;
            border-radius: 6px;
            word-break: break-all;
        }
        .log-info { background: #2d2d2d; color: #d4d4d4; border-left: 3px solid #2196F3; }
        .log-success { background: #1e3a1e; color: #4CAF50; border-left: 3px solid #4CAF50; }
        .log-error { background: #3a1e1e; color: #f44336; border-left: 3px solid #f44336; }
        .btn-clear-log {
            background: #666;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .footer { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.8); font-size: 12px; }
        .cache-info {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #1565c0;
            text-align: center;
        }
        .category-selector {
            margin-top: 10px;
            padding: 8px;
            background: #fff3e0;
            border-radius: 6px;
            border-left: 3px solid #ff9800;
        }
        .category-selector label {
            font-size: 12px;
            font-weight: bold;
            color: #e65100;
            display: block;
            margin-bottom: 5px;
        }
        .category-selector select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ff9800;
            border-radius: 4px;
            font-size: 13px;
            background: white;
        }
        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .btn-delete:active { transform: scale(0.9); }
        .category-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #4CAF50;
            color: white;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 5px;
        }
        .category-badge.no-cat { background: #9e9e9e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Сканер чеков ФНС</h1>
        
        <div class="cache-info" id="cacheInfo">💾 Кэш: 0 чеков | API: 0/15 запросов сегодня</div>
        
        <div class="video-container">
            <video id="video" playsinline></video>
            <div class="scan-overlay"><div class="scan-line"></div></div>
        </div>
        
        <button class="button btn-scan" id="scanBtn" onclick="toggleScan()">📷 Начать сканирование</button>
        <button class="button btn-excel" onclick="exportToExcel()">📊 Экспорт в Excel (CSV)</button>
        <button class="button btn-1c" onclick="exportTo1C()">💼 Экспорт для 1С (TXT)</button>
        <button class="button btn-clear" onclick="clearCodes()">🗑️ Очистить все</button>
        
        <div class="stats">📊 Сохранено чеков: <span id="count">0</span></div>
        
        <div class="codes-container" id="codes-list">
            <div class="empty-state">Нет сохраненных чеков<br>Отсканируйте первый чек!</div>
        </div>
        
        <div class="log-container" id="logContainer">
            <div style="color: #999; text-align: center;">Лог пуст</div>
        </div>
        <button class="btn-clear-log" onclick="clearLog()">🗑️ Очистить лог</button>
    </div>
    
    <div class="footer">v13.1 | Категории + Удаление + Вибрация</div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        const API_TOKEN = "53441.ZLqLc0Gvo8gziNZXF"; 
        
        // ==========================================
        // 🛠️ НАСТРОЙКИ: ЛЕГКО ДОБАВЛЯЙТЕ КАТЕГОРИИ СЮДА
        // ==========================================
        const CATEGORIES = [
            { id: "uncategorized", name: "Не указано" },
            { id: "products", name: "Продукты" },
            { id: "construction", name: "Стройматериалы" },
            { id: "fuel", name: "Бензин / ГСМ" },
            { id: "pharmacy", name: "Аптека" },
            { id: "household", name: "Хозтовары" },
            { id: "clothes", name: "Одежда / Обувь" },
            { id: "electronics", name: "Электроника" },
            { id: "services", name: "Услуги" }
        ];

        let isProcessing = false;
        let lastScanTime = 0;
        const SCAN_COOLDOWN = 3000;
        
        let video = document.getElementById('video');
        let canvas = document.createElement('canvas');
        let context = canvas.getContext('2d');
        let scanning = false;
        let scanTimeout = null;
        let stream = null;

        window.onload = function() { 
            loadSavedCodes(); 
            updateCacheInfo();
            addLog('✅ Сканер готов к работе', 'success');
        };

        function updateCacheInfo() {
            const receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            const cache = JSON.parse(localStorage.getItem('receipts_cache') || '{}');
            const cacheCount = Object.keys(cache).length;
            const today = new Date().toDateString();
            const dailyStats = JSON.parse(localStorage.getItem('daily_stats') || '{}');
            const todayRequests = dailyStats[today] || 0;
            document.getElementById('cacheInfo').textContent = '💾 Кэш: ' + cacheCount + ' чеков | API: ' + todayRequests + '/15 запросов сегодня | Всего: ' + receipts.length;
        }

        function toggleScan() { scanning ? stopScan() : startScan(); }

        function startScan() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function(mediaStream) {
                stream = mediaStream;
                video.srcObject = stream;
                video.play();
                scanning = true;
                const btn = document.getElementById('scanBtn');
                btn.textContent = '⏹️ Остановить камеру';
                btn.classList.add('scanning');
                addLog('📡 Камера запущена', 'info');
                requestAnimationFrame(tick);
            })
            .catch(function(err) { addLog('❌ Ошибка камеры: ' + err.message, 'error'); });
        }

        function stopScan() { stopCamera(); }

        function stopCamera() {
            scanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (scanTimeout) {
                clearTimeout(scanTimeout);
                scanTimeout = null;
            }
            const btn = document.getElementById('scanBtn');
            btn.textContent = '📷 Начать сканирование';
            btn.classList.remove('scanning');
        }

        function tick() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                let imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                let code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    handleScan(code.data);
                    return;
                }
            }
            requestAnimationFrame(tick);
        }

        async function handleScan(qrData) {
            if (isProcessing) return;
            const now = Date.now();
            if (now - lastScanTime < SCAN_COOLDOWN) return;
            lastScanTime = now;
            
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            if (receipts.some(r => r.qr === qrData)) {
                addLog('⚠️ Чек уже сохранён', 'error');
                stopCamera();
                return;
            }
            
            let cache = JSON.parse(localStorage.getItem('receipts_cache') || '{}');
            if (cache[qrData]) {
                addLog('✅ Чек взят из кэша', 'success');
                receipts.push(cache[qrData]);
                localStorage.setItem('receipts', JSON.stringify(receipts));
                loadSavedCodes();
                updateCacheInfo();
                stopCamera();
                return;
            }

            const today = new Date().toDateString();
            let dailyStats = JSON.parse(localStorage.getItem('daily_stats') || '{}');
            if (!dailyStats[today]) dailyStats[today] = 0;
            
            if (dailyStats[today] >= 15) {
                addLog('⚠️ Дневной лимит API исчерпан', 'error');
                saveBasicReceipt(qrData, receipts);
                stopCamera();
                return;
            }

            isProcessing = true;
            addLog('🔄 Запрос к API...', 'info');
            
            try {
                const formData = new URLSearchParams();
                formData.append('qrraw', qrData);
                formData.append('token', API_TOKEN);

                const response = await fetch('https://proverkacheka.com/api/v1/check/get', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const text = await response.text();
                addLog('HTTP: ' + response.status, 'info');

                const data = JSON.parse(text);

                if (data.code === 1) {
                    dailyStats[today] = (dailyStats[today] || 0) + 1;
                    localStorage.setItem('daily_stats', JSON.stringify(dailyStats));
                    
                    const json = data.data.json;
                    const address = String(json.retailPlaceAddres || json.retailPlaceAddress || json.address || '');
                    
                    let receiptObj = {
                        qr: qrData,
                        date: json.ticketDate || parseQRDate(qrData),
                        total: json.totalSum ? (parseFloat(json.totalSum) / 100).toFixed(2) : parseQRSum(qrData),
                        shop: String(json.user || ''),
                        inn: String(json.userInn || ''),
                        address: address,
                        checkNumber: String(json.requestNumber || ''),
                        shiftNumber: String(json.shiftNumber || ''),
                        cashier: String(json.operator || ''),
                        operationType: String(json.operationType || '1'),
                        category: 'uncategorized', // По умолчанию
                        items: (json.items || []).map(item => ({
                            name: String(item.name || 'Товар'),
                            quantity: item.quantity || 1,
                            price: item.price ? (parseFloat(item.price) / 100).toFixed(2) : '0.00',
                            sum: item.sum ? (parseFloat(item.sum) / 100).toFixed(2) : '0.00'
                        })),
                        timestamp: Date.now(),
                        status: 'ok'
                    };

                    receipts.push(receiptObj);
                    localStorage.setItem('receipts', JSON.stringify(receipts));
                    cache[qrData] = receiptObj;
                    localStorage.setItem('receipts_cache', JSON.stringify(cache));
                    
                    // Вибрация при успехе (если поддерживается устройством)
                    if (navigator.vibrate) navigator.vibrate(200);
                    
                    addLog('✅ Чек расшифрован! Товаров: ' + receiptObj.items.length, 'success');
                    loadSavedCodes();
                    updateCacheInfo();
                } else {
                    addLog('⚠️ Ошибка API (code=' + data.code + ')', 'error');
                }
            } catch (error) {
                addLog('❌ Ошибка: ' + error.message, 'error');
            } finally {
                isProcessing = false;
            }
            stopCamera();
        }

        function saveBasicReceipt(qrData, receipts) {
            receipts.push({
                qr: qrData,
                date: parseQRDate(qrData),
                total: parseQRSum(qrData),
                shop: '', inn: '', address: '',
                checkNumber: '', shiftNumber: '', cashier: '',
                operationType: '1', category: 'uncategorized',
                items: [],
                timestamp: Date.now(),
                status: 'partial'
            });
            localStorage.setItem('receipts', JSON.stringify(receipts));
            loadSavedCodes();
            updateCacheInfo();
        }

        function deleteReceipt(index) {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            if (index >= 0 && index < receipts.length) {
                const deleted = receipts.splice(index, 1)[0];
                localStorage.setItem('receipts', JSON.stringify(receipts));
                
                let cache = JSON.parse(localStorage.getItem('receipts_cache') || '{}');
                delete cache[deleted.qr];
                localStorage.setItem('receipts_cache', JSON.stringify(cache));
                
                addLog('🗑️ Чек удалён', 'success');
                loadSavedCodes();
                updateCacheInfo();
            }
        }

        function updateCategory(index, categoryId) {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            if (index >= 0 && index < receipts.length) {
                receipts[index].category = categoryId;
                localStorage.setItem('receipts', JSON.stringify(receipts));
                
                let cache = JSON.parse(localStorage.getItem('receipts_cache') || '{}');
                if (cache[receipts[index].qr]) {
                    cache[receipts[index].qr].category = categoryId;
                    localStorage.setItem('receipts_cache', JSON.stringify(cache));
                }
                
                addLog('✅ Категория: ' + getCategoryName(categoryId), 'success');
                loadSavedCodes();
            }
        }

        function getCategoryName(categoryId) {
            const cat = CATEGORIES.find(c => c.id === categoryId);
            return cat ? cat.name : 'Не указано';
        }

        function addLog(message, type) {
            const logContainer = document.getElementById('logContainer');
            if (logContainer.children.length === 1 && logContainer.children[0].style.color === 'rgb(153, 153, 153)') {
                logContainer.innerHTML = '';
            }
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry log-' + type;
            logEntry.textContent = new Date().toLocaleTimeString() + ' ' + message;
            logContainer.insertBefore(logEntry, logContainer.firstChild);
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function clearLog() {
            document.getElementById('logContainer').innerHTML = '<div style="color: #999; text-align: center;">Лог пуст</div>';
        }

        function parseQRDate(qrData) {
            const t = extractQRParam(qrData, 't');
            if (t && t.length >= 8) {
                const date = t.substr(6, 2) + '.' + t.substr(4, 2) + '.' + t.substr(0, 4);
                const time = t.length >= 12 ? t.substr(9, 2) + ':' + t.substr(11, 2) : '';
                return time ? date + ' ' + time : date;
            }
            return new Date().toLocaleString('ru-RU');
        }

        function parseQRSum(qrData) {
            const s = extractQRParam(qrData, 's');
            return s ? parseFloat(s).toFixed(2) : '0.00';
        }

        function extractQRParam(qrData, paramName) {
            const params = new URLSearchParams(qrData);
            return params.get(paramName);
        }

        function loadSavedCodes() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            document.getElementById('count').textContent = receipts.length;
            const list = document.getElementById('codes-list');
            
            if (receipts.length === 0) {
                list.innerHTML = '<div class="empty-state">Нет сохраненных чеков<br>Отсканируйте первый чек!</div>';
                return;
            }
            
            list.innerHTML = '';
            const displayCodes = receipts.slice(-10).reverse();
            
            displayCodes.forEach((receipt, index) => {
                const realIndex = receipts.length - index;
                const arrayIndex = receipts.length - 1 - index;
                const div = document.createElement('div');
                div.className = 'code-item';
                if (receipt.status === 'partial') div.classList.add('partial-border');
                if (!receipt.category || receipt.category === 'uncategorized') div.classList.add('no-category');
                
                let html = '<button class="btn-delete" onclick="deleteReceipt(' + arrayIndex + ')" title="Удалить чек">✕</button>';
                html += '<div class="code-header"><span>Чек #' + realIndex + '</span><span>' + receipt.date + '</span></div>';
                html += '<div class="receipt-summary">💰 ' + receipt.total + ' ₽</div>';
                
                if (receipt.shop) html += '<div class="receipt-info">🏪 ' + receipt.shop + '</div>';
                if (receipt.inn) html += '<div class="receipt-info">📋 ИНН: ' + receipt.inn + '</div>';
                if (receipt.address) html += '<div class="receipt-info">📍 ' + receipt.address + '</div>';
                if (receipt.checkNumber) html += '<div class="receipt-info">🧾 Чек № ' + receipt.checkNumber + '</div>';
                if (receipt.cashier) html += '<div class="receipt-info">👤 Кассир: ' + receipt.cashier + '</div>';
                
                html += '<div class="category-selector">';
                html += '<label>📁 Категория для 1С:</label>';
                html += '<select onchange="updateCategory(' + arrayIndex + ', this.value)">';
                CATEGORIES.forEach(cat => {
                    const selected = receipt.category === cat.id ? 'selected' : '';
                    html += '<option value="' + cat.id + '" ' + selected + '>' + cat.name + '</option>';
                });
                html += '</select>';
                html += '</div>';
                
                if (receipt.category && receipt.category !== 'uncategorized') {
                    html += '<div class="category-badge">' + getCategoryName(receipt.category) + '</div>';
                } else {
                    html += '<div class="category-badge no-cat">⚠️ Категория не указана</div>';
                }
                
                html += '<div class="receipt-qr-string">' + receipt.qr + '</div>';
                
                if (receipt.items && receipt.items.length > 0) {
                    html += '<div class="receipt-items">';
                    receipt.items.forEach(item => {
                        html += '<div class="item-row"><span class="item-name">' + item.name + '</span><span class="item-qty">' + item.quantity + ' шт.</span><span class="item-price">' + item.sum + ' ₽</span></div>';
                    });
                    html += '</div>';
                } else if (receipt.status === 'partial') {
                    html += '<div style="font-size:12px;color:#ff9800;margin-top:5px">⚠️ Без состава</div>';
                }
                
                div.innerHTML = html;
                list.appendChild(div);
            });
        }

        function exportToExcel() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            if (receipts.length === 0) { 
                alert('❌ Нет сохраненных чеков!');
                return; 
            }
            
            try {
                let csvContent = '\uFEFFДата;Сумма;Организация;ИНН;Адрес;Чек№;Смена;Кассир;Категория;QR-строка\n';
                
                receipts.forEach(function(receipt) {
                    const date = String(receipt.date || '');
                    const total = String(receipt.total || '0.00');
                    const shop = String(receipt.shop || '').replace(/;/g, ',');
                    const inn = String(receipt.inn || '').replace(/;/g, ',');
                    const address = String(receipt.address || '').replace(/;/g, ',');
                    const checkNum = String(receipt.checkNumber || '').replace(/;/g, ',');
                    const shiftNum = String(receipt.shiftNumber || '').replace(/;/g, ',');
                    const cashier = String(receipt.cashier || '').replace(/;/g, ',');
                    const category = getCategoryName(receipt.category || 'uncategorized');
                    const qr = String(receipt.qr || '').replace(/"/g, '""');
                    
                    csvContent += date + ';' + total + ';' + shop + ';' + inn + ';' + address + ';' + checkNum + ';' + shiftNum + ';' + cashier + ';' + category + ';"' + qr + '"\n';
                });
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const dateStr = new Date().toISOString().slice(0,10);
                const filename = 'Чеки_ФНС_' + dateStr + '.csv';
                
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                alert('✅ Файл ' + filename + ' скачан!');
            } catch (error) {
                alert('❌ Ошибка экспорта: ' + error.message);
            }
        }

        function exportTo1C() {
    let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
    if (receipts.length === 0) { 
        alert('❌ Нет сохраненных чеков!');
        return; 
    }
    
    try {
        // Точный заголовок для 1С:УНФ
        let txtContent = '#1C:UNF\n';
        txtContent += '#Version:1.0\n';
        txtContent += '#Encoding:UTF-8\n';
        txtContent += '#Separator:;\n';
        txtContent += '#Fields:Date,Amount,Shop,INN,Address,CheckNum,ShiftNum,Cashier,Category,Item,Quantity,Price,QRString\n\n';
        
        receipts.forEach(function(receipt) {
            const date = String(receipt.date || '');
            const total = String(receipt.total || '0.00');
            const shop = String(receipt.shop || '').replace(/;/g, ',');
            const inn = String(receipt.inn || '').replace(/;/g, ',');
            const address = String(receipt.address || '').replace(/;/g, ',');
            const checkNum = String(receipt.checkNumber || '').replace(/;/g, ',');
            const shiftNum = String(receipt.shiftNumber || '').replace(/;/g, ',');
            const cashier = String(receipt.cashier || '').replace(/;/g, ',');
            const category = getCategoryName(receipt.category || 'uncategorized');
            const qr = String(receipt.qr || '').replace(/;/g, ',').replace(/"/g, '""');
            
            if (receipt.items && receipt.items.length > 0) {
                receipt.items.forEach(function(item) {
                    // Добавлено экранирование кавычек для названия товара
                    const name = String(item.name || 'Товар').replace(/;/g, ',').replace(/"/g, '""');
                    const qty = String(item.quantity || 1);
                    const price = String(item.price || '0.00');
                    
                    // Данные чека повторяются для КАЖДОЙ строки товара (как в вашем примере)
                    txtContent += date + ';' + total + ';' + shop + ';' + inn + ';' + address + ';' + checkNum + ';' + shiftNum + ';' + cashier + ';' + category + ';"' + name + '";' + qty + ';' + price + ';' + qr + '\n';
                });
            } else {
                txtContent += date + ';' + total + ';' + shop + ';' + inn + ';' + address + ';' + checkNum + ';' + shiftNum + ';' + cashier + ';' + category + ';"Без детализации";1;' + total + ';' + qr + '\n';
            }
        });
        
        // Чистый UTF-8 без BOM (как требует заголовок #Encoding:UTF-8)
        const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const dateStr = new Date().toISOString().slice(0,10);
        const filename = '1C_Чеки_' + dateStr + '.txt';
        
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        alert('✅ Файл ' + filename + ' скачан!\nФормат полностью соответствует требованиям 1С:УНФ.');
    } catch (error) {
        alert('❌ Ошибка экспорта: ' + error.message);
    }
}

        function clearCodes() {
            let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
            if (receipts.length === 0) { 
                alert('Нет чеков для удаления');
                return; 
            }
            if (confirm('⚠️ Удалить ВСЕ ' + receipts.length + ' чеков и кэш?\n\nЭто действие нельзя отменить!')) {
                localStorage.removeItem('receipts');
                localStorage.removeItem('receipts_cache');
                localStorage.removeItem('daily_stats');
                loadSavedCodes();
                updateCacheInfo();
                addLog('🗑️ Все чеки и кэш удалены', 'success');
                alert('✅ Все чеки удалены!');
            }
        }
    </script>
